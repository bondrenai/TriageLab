name: Live verification

# Builds a disposable kind cluster on the runner at the repository's pins and
# exercises the real kagent/Substrate deployment: the sandbox boundary without
# a model, then a model-backed investigation and pause/resume. The last two
# call the model provider and incur charges; the schedule is the cost dial.
# The install opts into the pinned controller fork so the pause check
# exercises durable retention.
# Nothing here reaches a shared or production cluster. The kind and kagent CLI
# pins follow docs/development.md; the Helm pin is carried over from the
# recorded rc3 runs.
on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/live.yml
      - deploy/**
      - scripts/**
      - examples/config-bug/**
      - internal/agent/**
      - internal/investigation/**
      - internal/kagent/**
  workflow_dispatch:
    inputs:
      sandbox_class:
        description: Substrate sandbox class to exercise (microvm uses the runner's /dev/kvm)
        required: false
        type: choice
        options: [gvisor, microvm, both]
        default: gvisor

permissions:
  contents: read

# A newer push replaces an older push's run. Scheduled and manual runs finish.
concurrency:
  group: live-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GOFLAGS: -trimpath

jobs:
  live:
    name: live (${{ matrix.sandbox_class }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Scheduled and push runs have no inputs and use gVisor.
        sandbox_class: ${{ fromJSON(github.event.inputs.sandbox_class == 'both' && '["gvisor","microvm"]' || github.event.inputs.sandbox_class == 'microvm' && '["microvm"]' || '["gvisor"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false # dependencies are vendored; no module cache is needed
      - name: Require the model credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Set the OPENAI_API_KEY repository secret for the live run" >&2
            exit 2
          fi
      - name: Verify that the runner can create KVM guests
        if: matrix.sandbox_class == 'microvm'
        run: |
          sudo python3 - <<'PY'
          import fcntl
          import os
          import sys

          try:
              with open("/dev/kvm", "r+b", buffering=0) as kvm:
                  if fcntl.ioctl(kvm, 0xAE00, 0) != 12:  # KVM_GET_API_VERSION
                      sys.exit("Unsupported KVM API version")
                  os.close(fcntl.ioctl(kvm, 0xAE01, 0))  # KVM_CREATE_VM
          except OSError as error:
              sys.exit(f"This runner cannot create KVM guests: {error}")
          print("KVM_CREATE_VM succeeded")
          PY
      - name: Install pinned kind, Helm, and kagent CLI
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind' | sha256sum -c -
          curl -fsSL -o helm.tar.gz https://get.helm.sh/helm-v3.18.0-linux-amd64.tar.gz
          echo '961e587fc2c03807f8a99ac25ef063fa9e6915f1894729399cbb95d2a79af931  helm.tar.gz' | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm
          curl -fsSL -o kagent https://github.com/kagent-dev/kagent/releases/download/v1.0.0/kagent-linux-amd64
          echo 'c1a0a37767c4c2526e6d42b7016cfc11e69e82e321f6b84c1499d539d0dd864d  kagent' | sha256sum -c -
          mkdir -p tools
          install -m 0755 kind linux-amd64/helm kagent tools/
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Create the disposable kind cluster
        env:
          KIND_CONFIG: ${{ matrix.sandbox_class == 'microvm' && 'deploy/kind-microvm.yaml' || 'deploy/kind.yaml' }}
        run: |
          kind create cluster --name triagelab --image kindest/node:v1.35.0 \
            --config "$KIND_CONFIG" --wait 120s
      - name: Install kagent, Substrate, and the investigator
        id: install
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRIAGELAB_SANDBOX_CLASS: ${{ matrix.sandbox_class }}
          TRIAGELAB_CONTROLLER: fork
        run: bash scripts/install-dev.sh
      - name: Confirm the WorkerPool backend
        env:
          SANDBOX_CLASS: ${{ matrix.sandbox_class }}
        run: |
          class="$(kubectl --context kind-triagelab -n kagent get workerpool kagent-default \
            -o jsonpath='{.spec.sandboxClasses[0].name}')"
          image="$(kubectl --context kind-triagelab -n kagent get workerpool kagent-default \
            -o jsonpath='{.spec.workerImage}')"
          controller="$(kubectl --context kind-triagelab -n kagent get deployment kagent-controller \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="controller")].image}')"
          {
            echo "### Deployment under test"
            echo "- WorkerPool sandbox class: \`$class\`"
            echo "- Worker image: \`$image\`"
            echo "- Controller image: \`$controller\`"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$image" in
            */ateworker-"$SANDBOX_CLASS":*) ;;
            *) echo "Unexpected worker image: $image" >&2; exit 1 ;;
          esac
          if [ "$SANDBOX_CLASS" = microvm ]; then
            kvm="$(kubectl --context kind-triagelab get nodes \
              -o jsonpath='{.items[*].status.capacity.ate\.dev/kvm}')"
            echo "- Node \`ate.dev/kvm\` capacity: \`$kvm\`" >> "$GITHUB_STEP_SUMMARY"
            kubectl --context kind-triagelab get sandboxconfig microvm
            test "$class" = microvm
          fi
      # Each check opens its own port-forward and token, and runs even when an
      # earlier one failed, so one failure does not hide the other results.
      - name: Check the sandbox boundary without a model
        id: sandbox
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TRIAGELAB_REPORT_DIR: ${{ runner.temp }}/reports
        run: bash scripts/live-verify.sh sandbox
      - name: Run the genuine investigation
        id: investigation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TRIAGELAB_REPORT_DIR: ${{ runner.temp }}/reports
        run: bash scripts/live-verify.sh investigation
      - name: Run the genuine pause and resume
        id: pause
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TRIAGELAB_REPORT_DIR: ${{ runner.temp }}/reports
        run: bash scripts/live-verify.sh pause
      - name: Summarize the checks
        if: always()
        env:
          SANDBOX_CLASS: ${{ matrix.sandbox_class }}
          SANDBOX_OUTCOME: ${{ steps.sandbox.outcome }}
          INVESTIGATION_OUTCOME: ${{ steps.investigation.outcome }}
          PAUSE_OUTCOME: ${{ steps.pause.outcome }}
        run: |
          {
            echo "### Live checks on $SANDBOX_CLASS"
            echo "| Check | Calls the model | Outcome |"
            echo "| --- | --- | --- |"
            echo "| Sandbox upload, egress denial, termination, deletion | no | ${SANDBOX_OUTCOME:-not run} |"
            echo "| Investigation | yes | ${INVESTIGATION_OUTCOME:-not run} |"
            echo "| Pause and resume | yes | ${PAUSE_OUTCOME:-not run} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-reports-${{ matrix.sandbox_class }}
          path: ${{ runner.temp }}/reports
          if-no-files-found: ignore
          retention-days: 7
      - name: Describe the deployment after a failure
        if: failure()
        run: |
          kubectl --context kind-triagelab get nodes -o wide || true
          kubectl --context kind-triagelab get sandboxconfigs || true
          kubectl --context kind-triagelab -n kagent get workerpools,sandboxtemplates,agents,pods -o wide || true
          kubectl --context kind-triagelab -n kagent describe workerpool kagent-default || true
          kubectl --context kind-triagelab -n kagent describe sandboxtemplate triagelab-python || true
          kubectl --context kind-triagelab -n ate-system get pods -o wide || true
      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name triagelab
