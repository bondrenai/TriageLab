name: CI

# Documentation-only changes (root Markdown, docs/, docs-site/) skip the code
# jobs below; the changes job owns that decision and unknown inputs always run
# the full matrix. Release runs call this workflow and run everything.

on:
  # Also called by release.yml so a release publishes only after these checks pass.
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run against the dedicated kagent/Substrate test deployment
        required: false
        type: boolean
        default: false
      cases:
        description: Evaluation case names separated by commas, or all for the full corpus
        type: string
        default: config-bug

permissions:
  contents: read

env:
  GOFLAGS: -trimpath

jobs:
  # Decides whether this event can only have changed documentation. A push or
  # PR limited to root Markdown files, docs/, or docs-site/ cannot affect the
  # Go, web, chart, or image builds. The generated reference pages and the
  # example files count as code: the golden test in cmd/triagelab reads them.
  # Anything unrecognized, a missing merge base, workflow_call from release,
  # and manual dispatches all run the full matrix.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff base is not part of a shallow clone
      - id: detect
        name: Detect a documentation-only change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          record() { echo "docs_only=$1" >> "$GITHUB_OUTPUT"; }
          case "$EVENT_NAME" in
            push) base_ref="$BEFORE" ;;
            pull_request) base_ref="origin/$BASE_REF" ;;
            *) record false; exit 0 ;;
          esac
          # New branches and rewritten histories share no base: run everything.
          if ! base="$(git merge-base "$base_ref" "$AFTER" 2>/dev/null)" || [ -z "$base" ]; then
            record false
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$AFTER")"
          # Inputs of the generated reference pages are code to the Go tests.
          if printf '%s\n' "$changed" | grep -qE '^(docs-site/src/content/docs/reference/|examples/)'; then
            record false
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qvE '^([^/]+\.md|docs/|docs-site/)'; then
            record false
          else
            record true
          fi

  checks:
    name: checks (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false # dependencies are vendored; no module cache is needed
      - run: make check

  # Separate from checks: the race detector slows the sign-in tests about tenfold.
  race:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false # dependencies are vendored; no module cache is needed
      - run: make race

  lint:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false # the pinned linter is fetched on each run; the module itself is vendored
      - run: make lint # staticcheck at a pinned version; see staticcheck.conf

  # Separate from lint so a toolchain advisory is not mistaken for a code finding.
  vulncheck:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false # the pinned scanner is fetched on each run; the module itself is vendored
      - run: make vulncheck # govulncheck at a pinned version

  frontend:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make install-ui
      - run: make check-ui # TypeScript and the safe Markdown parser tests
      - run: make build-ui

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: make install-docs
      - run: make build-docs # includes starlight-links-validator; generated-page drift is covered by make check

  helm:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make chart-lint

  image:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the container image without publishing
        run: docker build --tag triagelab:ci .

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false # dependencies are vendored; no module cache is needed
      - name: Write the dedicated integration configuration privately
        env:
          INTEGRATION_CONFIG: ${{ secrets.TRIAGELAB_CONFIG_JSON }}
        run: |
          if [ -z "$INTEGRATION_CONFIG" ]; then
            echo "Set TRIAGELAB_CONFIG_JSON for a dedicated test deployment" >&2
            exit 2
          fi
          umask 077
          printf '%s' "$INTEGRATION_CONFIG" > "$RUNNER_TEMP/triagelab.json"
      - name: Run genuine integration tests
        env:
          TRIAGELAB_CASES: ${{ inputs.cases }}
          TRIAGELAB_REPORT_DIR: ${{ runner.temp }}/reports
          TRIAGELAB_CONFIG: ${{ runner.temp }}/triagelab.json
          TRIAGELAB_TOKEN: ${{ secrets.TRIAGELAB_TOKEN }}
        run: make test-integration
      - name: Keep the evaluation scorecard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: investigation-evaluation-scorecard
          path: ${{ runner.temp }}/reports/corpus-scorecard-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove integration configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/triagelab.json"
