{{- include "triagelab.checks" . -}}
{{- if and .Values.token.create (not .Values.token.secretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "triagelab.fullname" . }}-token
  labels:
    {{- include "triagelab.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "triagelab.tokenSecretKey" . }}: {{ .Values.token.value | quote }}
{{- end }}
{{- if and .Values.tickets.enabled .Values.tickets.config }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "triagelab.fullname" . }}-tickets
  labels:
    {{- include "triagelab.labels" . | nindent 4 }}
type: Opaque
stringData:
  tickets.json: |
    {{- .Values.tickets.config | toPrettyJson | nindent 4 }}
{{- if and .Values.tickets.token.create (not .Values.tickets.token.secretName) .Values.tickets.config.token_env .Values.tickets.token.value }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "triagelab.fullname" . }}-tickets-token
  labels:
    {{- include "triagelab.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "triagelab.ticketsTokenSecretKey" . }}: {{ .Values.tickets.token.value | quote }}
{{- end }}
{{- end }}
{{- if and .Values.auth.enabled .Values.auth.config }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "triagelab.fullname" . }}-auth
  labels:
    {{- include "triagelab.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth.json: |
    {{- .Values.auth.config | toPrettyJson | nindent 4 }}
{{- if and .Values.auth.secret.create (not .Values.auth.secret.secretName) .Values.auth.config.oidc .Values.auth.config.oidc.client_secret_env .Values.auth.secret.value }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "triagelab.fullname" . }}-auth-token
  labels:
    {{- include "triagelab.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "triagelab.authSecretTokenKey" . }}: {{ .Values.auth.secret.value | quote }}
{{- end }}
{{- end }}
{{- if and .Values.telemetry.enabled .Values.telemetry.config.headers_env .Values.telemetry.headers.create (not .Values.telemetry.headers.secretName) .Values.telemetry.headers.value }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "triagelab.telemetryHeadersSecretName" . }}
  labels:
    {{- include "triagelab.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "triagelab.telemetryHeadersSecretKey" . }}: {{ .Values.telemetry.headers.value | quote }}
{{- end }}
