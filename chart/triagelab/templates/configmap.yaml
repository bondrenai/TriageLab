apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "triagelab.fullname" . }}
  labels:
    {{- include "triagelab.labels" . | nindent 4 }}
data:
  config.json: |
    {{- .Values.config | toPrettyJson | nindent 4 }}
  {{- if .Values.telemetry.enabled }}
  telemetry.json: |
    {{- .Values.telemetry.config | toPrettyJson | nindent 4 }}
  {{- end }}
