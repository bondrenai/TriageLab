{{- if .Values.gitops.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "triagelab.fullname" . }}-gitops
  labels:
    {{- include "triagelab.labels" . | nindent 4 }}
rules:
  - apiGroups: [triagelab.bondren.ai]
    resources: [ticketconnections, ticketprocedures]
    verbs: [list]
  - apiGroups: [triagelab.bondren.ai]
    resources: [ticketconnections/status]
    verbs: [patch]
  {{- if .Values.gitops.secretNames }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- toYaml .Values.gitops.secretNames | nindent 6 }}
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "triagelab.fullname" . }}-gitops
  labels:
    {{- include "triagelab.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "triagelab.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "triagelab.fullname" . }}-gitops
{{- end }}
