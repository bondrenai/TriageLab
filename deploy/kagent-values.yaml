# Private, single-user development installation; see docs/development.md.
# kagent 1.0.0 chart values, checked against the release's protobuf config.
global:
  watchNamespaces: [kagent]
rbac:
  namespaces: [kagent]
config:
  server:
    auth:
      mode: insecure
      serviceAccount:
        authority: triagelab-development
  logging:
    level: warn
  sessions:
    # Investigations may wait for weeks. TriageLab deletes Sessions on close.
    idleTtl: 0s
  sandboxes:
    guestImage: ghcr.io/kagent-dev/kagent/sandbox-guest@sha256:354825706868fc4d39300fe7795f4fa04d1eb53c3c93fb5b65b5da76f8222db7
    cpu: "1"
    memory: 512Mi
    defaultTtl: 900s
    maxTtl: 1800s
  runtimeDefaults:
    cpu: "1"
    memory: 1Gi
    # Forward the verified invocation token only through the sandbox API's
    # RemoteMCPServer tokenPassthrough setting.
    tokenPropagation:
      enabled: false
    builtinTools:
      disableBash: true
      disableFileSearch: true
      disableAskUser: true
    logging:
      level: warn
controller:
  substrateClientCertificate:
    enabled: true
  service:
    type: ClusterIP
substrateWorkerPool:
  create: true
  name: kagent-default
  replicas: 1
  sandboxClass: gvisor
  sandboxConfigRef: gvisor-default
  workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.0
  template:
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "3"
        memory: 3Gi
ui:
  replicas: 0
kagent-tools:
  enabled: false
providers:
  default: openAI
  openAI:
    provider: OpenAI
    # Helm default only; TriageLab uses its own triagelab-model (gpt-6.1-sol).
    model: gpt-6-luna
    apiKeySecretRef: kagent-openai
    apiKeySecretKey: OPENAI_API_KEY
