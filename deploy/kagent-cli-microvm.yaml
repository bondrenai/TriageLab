# kagent-cli.yaml with the microVM WorkerPool overlay applied last. Keep the
# chart pins identical to kagent-cli.yaml.
# valuesFiles are resolved relative to this configuration file.
install:
  defaultModelProvider: OpenAI
  kagent:
    repository: oci://ghcr.io/kagent-dev/kagent/helm/
    version: 1.0.0
    valuesFiles: [kagent-values.yaml, kagent-values-microvm.yaml]
  substrate:
    repository: oci://ghcr.io/kagent-dev/substrate/helm/
    version: 1.0.0
  atelet:
    repository: oci://ghcr.io/kagent-dev/substrate/helm/
    version: 1.0.0
  podCertificate:
    repository: oci://ghcr.io/kagent-dev/substrate/helm/
    version: 1.0.0
