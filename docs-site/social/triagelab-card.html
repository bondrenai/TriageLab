<!doctype html>
<!--
  Default social card for every page that does not define its own via
  frontmatter (1200 x 630). Colors and type come from src/styles/tokens.css;
  keep them in step.

  Render from docs-site/ after `npm ci` (the fonts load from node_modules):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1200,630 \
      --screenshot=public/social/triagelab-card.png \
      "file://$PWD/social/triagelab-card.html"
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TriageLab</title>
    <style>
      @font-face {
        font-family: "IBM Plex Serif";
        font-weight: 300;
        src: url("../node_modules/@fontsource/ibm-plex-serif/files/ibm-plex-serif-latin-300-normal.woff2");
      }
      @font-face {
        font-family: "IBM Plex Serif";
        font-weight: 300;
        font-style: italic;
        src: url("../node_modules/@fontsource/ibm-plex-serif/files/ibm-plex-serif-latin-300-italic.woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 400;
        src: url("../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 600;
        src: url("../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 500;
        src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2");
      }

      :root {
        --paper: #edf1f7;
        --ink: #0e131a;
        --ink-1: #1e232a;
        --ink-muted: #474c56;
        --hinge: #657082;
        --accent: #1f3fd8;
        --serif: "IBM Plex Serif", Georgia, serif;
        --sans: "IBM Plex Sans", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      /* Bench paper with the site's graph grid: fine lines every 28px and a
         heavier one every fifth. */
      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 388px;
        column-gap: 60px;
        padding: 56px 72px 52px 64px;
        background-color: var(--paper);
        background-image:
          repeating-linear-gradient(to right, rgba(31, 63, 216, 0.07) 0 1px, transparent 1px 140px),
          repeating-linear-gradient(to bottom, rgba(31, 63, 216, 0.07) 0 1px, transparent 1px 140px),
          repeating-linear-gradient(to right, rgba(31, 63, 216, 0.04) 0 1px, transparent 1px 28px),
          repeating-linear-gradient(to bottom, rgba(31, 63, 216, 0.04) 0 1px, transparent 1px 28px);
        color: var(--ink-1);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      /* --- Left: lockup, tagline, source -------------------------------- */

      .copy {
        display: flex;
        flex-direction: column;
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 27px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .lockup svg {
        width: 44px;
        height: 44px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 11px;
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .eyebrow::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
      }

      .headline {
        margin-top: auto;
      }
      h1 {
        margin-top: 22px;
        font-family: var(--serif);
        font-size: 84px;
        font-weight: 300;
        line-height: 1.06;
        letter-spacing: -0.022em;
        color: var(--ink);
      }
      h1 em {
        font-style: italic;
      }

      .source {
        margin-top: auto;
        font-family: var(--mono);
        font-size: 17px;
        color: var(--hinge);
      }

      /* --- Right: the mark itself, the figure under examination --------- */

      .figure {
        align-self: center;
        justify-self: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .figure svg {
        width: 232px;
        height: 232px;
      }

      .figure .label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 34px;
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .figure .label::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="lockup">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#0e131a">
          <path d="M4 13V4H13M35 4H44V13M44 35V44H35M13 44H4V35" stroke-width="2.5" stroke-linecap="square" />
          <path
            d="M17.5 10.5H30.5M20.5 10.5V19L11.5 37.5H36.5L27.5 19V10.5M15.5 29.5H32.5"
            stroke-width="2.75"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="24" cy="33.5" r="2.4" fill="#1f3fd8" stroke="none" />
        </svg>
        TriageLab
      </div>

      <div class="headline">
        <p class="eyebrow">Evidence-driven investigations on Kubernetes</p>
        <h1>Evidence, not <em>guesses</em>.</h1>
      </div>

      <p class="source">bondrenai.github.io/TriageLab</p>
    </div>

    <div class="figure">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#0e131a">
        <path d="M4 13V4H13M35 4H44V13M44 35V44H35M13 44H4V35" stroke-width="2.5" stroke-linecap="square" />
        <path
          d="M17.5 10.5H30.5M20.5 10.5V19L11.5 37.5H36.5L27.5 19V10.5M15.5 29.5H32.5"
          stroke-width="2.75"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="24" cy="33.5" r="2.4" fill="#1f3fd8" stroke="none" />
      </svg>
      <p class="label">Recorded evidence</p>
    </div>
  </body>
</html>
